<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To_Do_List</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: cadetblue;
            text-align: center;
            padding-top: 50px;
        }
        .todo{
            background-color: rgb(204, 230, 252);
            width: 400px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
        }
        input{
            padding: 10px;
            width: 250px;
        
        }
        button{
            padding: 10px;
            margin-left: 5px;
            border: none;
            color: bisque;
        }
        .add{
            background-color: rgb(36, 252, 36);
            color: black;

        }
        li{
            list-style: none;
            background-color: burlywood;
            margin: 10px;
            padding: 10px;
        }
        .edit{
            background-color: rgb(255, 211, 14);
            color: black;
        }
        .delete{
            background-color: red;
            color: black;
        }
        input:hover{
            background-color: rgb(173, 173, 243);
            color: black;
        }
        add:hover{
            background-color: rgb(173, 173, 243);
            color: black;
        }
    </style>
</head>
<body>
    <div class="todo" >
        <h2>To_Do_List</h2>
        <input type="text" id="task" placeholder="Enter your task">
        <button class="add" onclick ="addTask()">Add</button>
        <ul id="list"></ul>
    </div>
    <script>
        function addTask(){
            let task=document.getElementById("task").value;
            if(task==""){
                alert("Please enter a task");
                return;
            }
            let li=document.createElement("li");
            li.innerHTML=task;
            let editButton =document.createElement("Button");
            editButton.innerHTML="Edit";
            editButton.className="edit";
            editButton.onclick=function(){
                let newTask=prompt("Edit your task",task);
                if(newTask!=""){
                    li.firstChild.textContent=newTask;
                    task=newTask;
                }
            };
            let deleteButton=document.createElement("button");
            deleteButton.innerHTML="Delete";
            deleteButton.className="delete";
            deleteButton.onclick=function(){
                li.remove();
            };
            li.appendChild(editButton);
            li.appendChild(deleteButton);
            document.getElementById("list").appendChild(li);
            document.getElementById("task"),value=" ";

        }
    </script>
</body>
</html>
